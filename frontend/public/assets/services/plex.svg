<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" class="brand-mark" data-brand="plex" data-brand-version="prisme-1" aria-hidden="true"><defs><linearGradient id="prisme-plex-11-front" class="prisme-front" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="28" y2="30"><stop offset="0" class="prisme-start"/><stop offset=".48" class="prisme-mid"/><stop offset="1" class="prisme-end"/></linearGradient><linearGradient id="prisme-plex-11-back" class="prisme-back" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="28" y2="30"><stop offset="0" class="prisme-start"/><stop offset=".48" class="prisme-mid"/><stop offset="1" class="prisme-end"/></linearGradient><linearGradient id="prisme-plex-11-fold" class="prisme-fold" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="28" y2="30"><stop offset="0" class="prisme-start"/><stop offset=".48" class="prisme-mid"/><stop offset="1" class="prisme-end"/></linearGradient><linearGradient id="prisme-plex-11-light" class="prisme-light" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="28" y2="30"><stop offset="0" class="prisme-start"/><stop offset=".48" class="prisme-mid"/><stop offset="1" class="prisme-end"/></linearGradient><radialGradient id="prisme-plex-11-orb" cx="30%" cy="25%" r="75%"><stop offset="0" class="prisme-orb-light"/><stop offset=".42" class="prisme-mid"/><stop offset="1" class="prisme-end"/></radialGradient></defs><style>.brand-mark{display:inline-block;flex-shrink:0;color:var(--accent,#25c9ed);vertical-align:middle;stroke:none!important;overflow:visible}
.brand-mark path{stroke:color-mix(in srgb,var(--accent,#25c9ed) 60%,white)!important;stroke-width:.12;stroke-linejoin:round;paint-order:stroke fill}
.prisme-start{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 65%,white)}
.prisme-mid{stop-color:var(--accent,#25c9ed)}
.prisme-end{stop-color:var(--indigo,var(--secondary,#8d9cff))}
.prisme-back .prisme-start{stop-color:var(--indigo,var(--secondary,#8d9cff))}
.prisme-back .prisme-mid{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 60%,var(--indigo,var(--secondary,#8d9cff)))}
.prisme-back .prisme-end,.prisme-fold .prisme-end{stop-color:color-mix(in srgb,var(--indigo,var(--secondary,#8d9cff)) 65%,black)}
.prisme-fold .prisme-start{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 45%,black)}
.prisme-light .prisme-start{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 35%,white)}
.prisme-light .prisme-end{stop-color:var(--accent,#25c9ed)}
.sidebar-heading .brand .brand-mark{width:29px;height:29px}.shell-brand .brand .brand-mark{width:28px;height:28px}.mobile-brand .brand .brand-mark{width:26px;height:26px}
.prisme-nav-icon{display:inline-block;vertical-align:middle;flex-shrink:0;color:inherit}
.settings-tabs button{display:inline-flex;align-items:center;gap:8px}
[data-prisme-nav]{display:inline-flex;align-items:center;gap:8px}
.app-nav-icon>.prisme-nav-icon{width:20px;height:20px}
@media(forced-colors:active){.brand-mark path{fill:CanvasText!important}}

.prisme-orb-light{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 20%,white)}
</style><path d="M8 3.84H14.72Q16 3.84 16.96 5.44L25.28 14.72Q26.56 16 25.28 17.28L16.96 26.56Q16 28.16 14.72 28.16H8L18.24 16Z" fill="url(#prisme-plex-11-front)" fill-rule="evenodd"/><path d="M8 3.84 18.24 16H25.6L16.96 5.44Q16 3.84 14.72 3.84Z" fill="url(#prisme-plex-11-light)" fill-rule="evenodd"/><path d="M8 28.16 18.24 16H25.6L16.96 26.56Q16 28.16 14.72 28.16Z" fill="url(#prisme-plex-11-back)" fill-rule="evenodd"/></svg>
