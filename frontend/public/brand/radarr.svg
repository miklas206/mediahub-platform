<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" class="brand-mark" data-brand="radarr" data-brand-version="prisme-1" aria-hidden="true"><defs><linearGradient id="prisme-radarr-20-front" class="prisme-front" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="28" y2="30"><stop offset="0" class="prisme-start"/><stop offset=".48" class="prisme-mid"/><stop offset="1" class="prisme-end"/></linearGradient><linearGradient id="prisme-radarr-20-back" class="prisme-back" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="28" y2="30"><stop offset="0" class="prisme-start"/><stop offset=".48" class="prisme-mid"/><stop offset="1" class="prisme-end"/></linearGradient><linearGradient id="prisme-radarr-20-fold" class="prisme-fold" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="28" y2="30"><stop offset="0" class="prisme-start"/><stop offset=".48" class="prisme-mid"/><stop offset="1" class="prisme-end"/></linearGradient><linearGradient id="prisme-radarr-20-light" class="prisme-light" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="28" y2="30"><stop offset="0" class="prisme-start"/><stop offset=".48" class="prisme-mid"/><stop offset="1" class="prisme-end"/></linearGradient><radialGradient id="prisme-radarr-20-orb" cx="30%" cy="25%" r="75%"><stop offset="0" class="prisme-orb-light"/><stop offset=".42" class="prisme-mid"/><stop offset="1" class="prisme-end"/></radialGradient></defs><style>.brand-mark{display:inline-block;flex-shrink:0;color:var(--accent,#25c9ed);vertical-align:middle;stroke:none!important;overflow:visible}
.brand-mark path{stroke:color-mix(in srgb,var(--accent,#25c9ed) 60%,white)!important;stroke-width:.12;stroke-linejoin:round;paint-order:stroke fill}
.prisme-start{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 65%,white)}
.prisme-mid{stop-color:var(--accent,#25c9ed)}
.prisme-end{stop-color:var(--indigo,var(--secondary,#8d9cff))}
.prisme-back .prisme-start{stop-color:var(--indigo,var(--secondary,#8d9cff))}
.prisme-back .prisme-mid{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 60%,var(--indigo,var(--secondary,#8d9cff)))}
.prisme-back .prisme-end,.prisme-fold .prisme-end{stop-color:color-mix(in srgb,var(--indigo,var(--secondary,#8d9cff)) 65%,black)}
.prisme-fold .prisme-start{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 45%,black)}
.prisme-light .prisme-start{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 35%,white)}
.prisme-light .prisme-end{stop-color:var(--accent,#25c9ed)}
.sidebar-heading .brand .brand-mark{width:29px;height:29px}.shell-brand .brand .brand-mark{width:28px;height:28px}.mobile-brand .brand .brand-mark{width:26px;height:26px}
.prisme-nav-icon{display:inline-block;vertical-align:middle;flex-shrink:0;color:inherit}
.settings-tabs button{display:inline-flex;align-items:center;gap:8px}
[data-prisme-nav]{display:inline-flex;align-items:center;gap:8px}
.app-nav-icon>.prisme-nav-icon{width:20px;height:20px}
@media(forced-colors:active){.brand-mark path{fill:CanvasText!important}}

.prisme-orb-light{stop-color:color-mix(in srgb,var(--accent,#25c9ed) 20%,white)}
</style><path d="M3.2 6.72H28.8V27.52H3.2ZM7.68 15.04V23.04H24.32V15.04Z" fill="url(#prisme-radarr-20-front)" fill-rule="evenodd"/><path d="M3.2 3.52H28.8V9.6H3.2Z" fill="url(#prisme-radarr-20-back)" fill-rule="evenodd"/><path d="M13.76 16.32 20.48 19.2 13.76 22.08Z" fill="url(#prisme-radarr-20-light)" fill-rule="evenodd"/></svg>
