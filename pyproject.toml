[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mediahub-core"
version = "0.4.7"
description = "Local-first modular self-hosted media platform"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "argon2-cffi>=23.1,<26",
  "psutil>=6,<8", "PyYAML>=6,<7", "httpx>=0.28,<1", "packaging>=24,<27", "cryptography>=44,<50",
  "pyotp>=2.9,<3", "qrcode>=8,<9", "tzdata>=2026.4,<2027"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
mediahub = "mediahub.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
