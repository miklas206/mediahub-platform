name: fjordcopy

services:
  traefik:
    image: traefik:v3.3
    container_name: fjordhub-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=fjord-net"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fjord-net
    restart: unless-stopped

  fjordhub:
    image: ${FJORDHUB_IMAGE:-fjordcopy-fjordhub:latest}
    build: .
    container_name: fjordhub
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8091}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      - "${DATA_DIR:-./data}:/data"
      - "${APPS_DIR:-./apps}:/apps"
      - "${FJORDHUB_HOST_DIR:-.}:/fjordhub-src"
    environment:
      DATA_DIR: /data
      NVIDIA_DEVICE_ROOT: /host/dev
      HOST_CGROUP_ROOT: /host/sys/fs/cgroup
      HOST_PROC_ROOT: /host/proc
      FJORDHUB_MEMORY_RECONCILE: "1"
      PROXMOX_API_URL: ${PROXMOX_API_URL:-}
      FJORDHUB_STORAGE_SSH_HOST: ${FJORDHUB_STORAGE_SSH_HOST:-}
      PROXMOX_NODE: ${PROXMOX_NODE:-}
      PROXMOX_VMID: ${PROXMOX_VMID:-}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-true}
      APP_PORT: ${APP_PORT:-8091}
      TZ: ${TZ:-Europe/Copenhagen}
      SECRET_KEY: ${SECRET_KEY:?Set a unique SECRET_KEY in .env before starting MediaHub}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fjordcopy_session}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-fjordcopy}
      # Bundled catalogs work with a private fork and change with this repo.
      REGISTRY_URL: ${REGISTRY_URL:-/app/registry.json}
      PACKAGES_URL: ${PACKAGES_URL:-/app/packages_catalog.json}
      FJORDHUB_UPDATER_URL: http://fjordhub-updater:8090
      FJORDHUB_IMAGE: ${FJORDHUB_IMAGE:-fjordcopy-fjordhub:latest}
      APPS_DIR: /apps
      FJORDHUB_SRC_DIR: /fjordhub-src
      # Paths to each app's docker-compose directory on the host
      FJORDLENS_DIR: ${FJORDLENS_DIR:-}
      FJORD3D_DIR: ${FJORD3D_DIR:-${FJORDSHARE_DIR:-}}
      FJORDSHARE_DIR: ${FJORDSHARE_DIR:-}
      FJORDPARCEL_DIR: ${FJORDPARCEL_DIR:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fjordhub.rule=PathPrefix(`/`)"
      - "traefik.http.routers.fjordhub.priority=1"
      - "traefik.http.services.fjordhub.loadbalancer.server.port=8080"
    networks:
      - fjord-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  fjordhub-updater:
    build:
      context: .
      dockerfile: updater_service/Dockerfile
    container_name: fjordhub-updater
    working_dir: /repo
    environment:
      APP_DIR: /repo
      SERVICE_NAME: fjordhub
      UPDATER_SERVICE_NAME: fjordhub-updater
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-fjordcopy}
      COMPOSE_SERVICES: "fjordhub"
      DATA_DIR: ${DATA_DIR:-./data}
      APPS_DIR: ${APPS_DIR:-./apps}
      FJORDHUB_HOST_DIR: ${FJORDHUB_HOST_DIR:-.}
      FJORDHUB_UPDATER_STATE_DIR: /state
      FJORDCOPY_DATA_MOUNT: /data
      FJORDCOPY_REPOSITORY: ${FJORDCOPY_REPOSITORY:-miklas206/fjordcopy}
      REPO_BRANCH: ${REPO_BRANCH:-main}
      GIT_SSH_COMMAND: ssh -i /run/fjordcopy-git/id_ed25519 -o UserKnownHostsFile=/run/fjordcopy-git/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - "${FJORDHUB_HOST_DIR:-.}:/repo"
      - "${DATA_DIR:-./data}/fjordhub-updater:/state"
      - "${DATA_DIR:-./data}:/data"
      - "${DATA_DIR:-./data}/git-ssh:/run/fjordcopy-git:ro"
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fjord-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  fjord-net:
    name: fjord-net
    driver: bridge
