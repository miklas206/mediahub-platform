[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaseed"
version = "0.1.9"
description = "Independent MediaHub seedbox application"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "argon2-cffi>=23.1,<26"]

[tool.setuptools.packages.find]
include = ["mediaseed*"]

[tool.setuptools.package-data]
mediaseed = ["static/*", "static/flags/*", "static/themes/*", "static/extensions/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
