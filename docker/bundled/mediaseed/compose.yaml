name: mediaseed-preview
services:
  app:
    build: .
    depends_on:
      client-init:
        condition: service_completed_successfully
      qbittorrent:
        condition: service_started
    ports:
      - "${MEDIASEED_BIND:-127.0.0.1}:${MEDIASEED_PORT:-18800}:18800"
    environment:
      MEDIASEED_BASE_URL: ${MEDIASEED_BASE_URL:-http://127.0.0.1:18800}
      MEDIASEED_DATA: /data
      MEDIASEED_DOWNLOADS: /downloads
      MEDIASEED_QBIT_URL: http://qbittorrent:8080
      MEDIASEED_QBIT_USER: mediaseed
      MEDIASEED_QBIT_PASSWORD_FILE: /secrets/qbit-password
    volumes:
      - appdata:/data
      - downloads:/downloads
      - clientsecrets:/secrets:ro
    networks: [default, client]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen(os.environ['MEDIASEED_BASE_URL'] + '/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  client-init:
    build: .
    user: "0:0"
    network_mode: none
    entrypoint: [python, -m, mediaseed.client_init]
    volumes:
      - clientconfig:/config
      - clientsecrets:/secrets
    restart: "no"
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed
    depends_on:
      client-init:
        condition: service_completed_successfully
    environment:
      PUID: "1000"
      PGID: "1000"
      WEBUI_PORT: "8080"
      TZ: Europe/Copenhagen
    volumes:
      - clientconfig:/config
      - downloads:/downloads
    networks: [client]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  client:
    internal: true
volumes:
  appdata:
  downloads:
  clientconfig:
  clientsecrets: