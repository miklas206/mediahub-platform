name: mediahub-foundation-dev
services:
  core:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:18765:18765"
    environment:
      MEDIAHUB_BASE_URL: "http://127.0.0.1:18765"
      MEDIAHUB_DATA_DIR: /data
      MEDIAHUB_DEV_MODE: "false"
      MEDIAHUB_MOCK_APP: "false"
    volumes:
      - foundation-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
volumes:
  foundation-data:
