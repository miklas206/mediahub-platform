<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}MediaHub{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='logos/mediahub-mark.svg') }}" type="image/svg+xml">
  <meta name="application-name" content="MediaHub beta">
  <meta name="theme-color" content="#0f1115">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=static_version) }}">
</head>
<body class="auth-body">
  <div class="auth-center {% block center_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
